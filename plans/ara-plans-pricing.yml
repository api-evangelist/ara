description: >-
  Ara publishes NO API plans, because Ara publishes no API. plan_count is therefore 0 for
  the purpose of the API rating and must not be read otherwise. What Ara does publish is a
  self-serve MEDIA rate card for buying time on its New York City taxi-top screens — three
  fixed durations, checkout via Squarespace Commerce. Those media rates are recorded below
  under media_rates[] so the commercial surface is captured honestly, and deliberately NOT
  under plans[], so they are never mistaken for API pricing tiers. Anything larger than a
  full day is a "custom campaign" handled by email, and the partner/operator side of the
  business (fleet owners, retailers, municipalities) is contact-only with no published
  price at all.
