description: >-
  Probe of the RFC 8615 /.well-known/ namespace across every Ara host we could find.
  NOTHING WAS FOUND. Every path on the marketing host (www.arascreens.com, Squarespace)
  and the API host (api.arascreens.com, Rails on Heroku) returns 404. The driver/ops
  application host (app.arascreens.com) is a client-side React SPA whose catch-all route
  answers 200 with the SAME 3,890-byte HTML shell for every path, including paths that do
  not exist — those 200s are NOT documents and are recorded here as misses. The signage
  CMS host (cms.arascreens.com) is a CloudFront/S3 origin that returns 403 for any path
  other than its own index. No WellKnown or SecurityTxt pointer is emitted in apis.yml,
  because Ara serves no well-known document on any host.
