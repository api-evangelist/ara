name: Ara
description: >-
  Ara is a digital out-of-home (DOOH) advertising network that finances, installs, and operates
  rich-media displays across mobility, municipal, parking, and retail settings. It describes itself
  as the largest U.S. owner-operator of rideshare and taxi car-top digital billboards, running a
  long-term partnership with Uber alongside in-car, storefront, and parking/municipal kiosk screens.
  Ara owns the hardware and content-management operations under a subscription model so partners avoid
  cap-ex and operational overhead. No public developer API, SDK, or developer portal is currently
  published; this profile was added to the API Evangelist network as a portfolio/enrichment lead.
