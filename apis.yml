name: Ara
description: >-
  Ara (Ara Labs, Inc.) is a digital out-of-home (DOOH) advertising network that finances, installs,
  and operates rich-media displays across mobility, municipal, parking, and retail settings. It
  describes itself as the largest U.S. owner-operator of rideshare and taxi car-top digital
  billboards, running a long-term partnership with Uber alongside in-car, storefront, and
  parking/municipal kiosk screens. Ara owns the hardware and content-management operations under a
  monthly subscription model so fleet owners, retailers, parking operators and municipalities avoid
  cap-ex and operational overhead, and it also sells self-serve NYC taxi-top ad time by the hour or
  day. Its own site names Founders Fund, Coatue, Rosecliff Ventures, iHeart Media and Kellogg's as
  investors. Ara publishes NO public API, SDK, developer portal, documentation site or
  machine-readable specification. Contract discovery in August 2026 found a live private backend at
  api.arascreens.com (Ruby on Rails on Heroku) that answers every route with an HTTP Basic challenge,
  a React driver/operations application at app.arascreens.com, and a third-party signage CMS front
  end at cms.arascreens.com — all credentialed product infrastructure, none of it a developer
  offering.
